      targetPort: 9010
---
# flink-jobmanager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-jobmanager
      lb: shared-load-balancer
  template:
    metadata:
      labels:
        app: flink-jobmanager
        lb: shared-load-balancer
    spec:
      containers:
        - name: flink-jobmanager
          image: flink:2.0.0-java21
          ports:
            - containerPort: 8081
              name: webui
            - containerPort: 6123
              name: rpc
            - containerPort: 6124
              name: blob-server
            - containerPort: 9249
              name: monitoring
          env:
            - name: FLINK_PROPERTIES
              value: |+
                jobmanager.rpc.address: flink-jobmanager
                metrics.reporters: prom
                metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
                metrics.reporter.prom.interval: 1s
                metrics.reporter.prom.port: 9249
          args: ["jobmanager"]
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
spec:
  selector:
    app: flink-jobmanager
  ports:
    - port: 8081
      name: webui
      targetPort: 8081
    - port: 6123
      name: rpc
      targetPort: 6123
    - port: 6124
      name: blob-server
      targetPort: 6124
    - port: 9249
      name: monitoring
      targetPort: 9249
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager-external
spec:
  selector:
    app: flink-jobmanager
  ports:
    - port: 8081
      name: webui
      targetPort: 8081
---
# flink-taskmanager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
    spec:
      containers:
        - name: flink-taskmanager
          image: flink:2.0.0-java21
          ports:
            - containerPort: 9249
              name: monitoring
          env:
            - name: FLINK_PROPERTIES
              value: |+
                jobmanager.rpc.address: flink-jobmanager
                taskmanager.numberOfTaskSlots: 12
                metrics.reporters: prom
                metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
                metrics.reporter.prom.interval: 1s
                metrics.reporter.prom.port: 9249
          args: ["taskmanager"]
---
apiVersion: v1
kind: Service
metadata:
  name: flink-taskmanager
spec:
  selector:
    app: flink-taskmanager
  ports:
    - port: 9249
      targetPort: 9249
---
