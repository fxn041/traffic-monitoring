# shared load balancer service
apiVersion: v1
kind: Service
metadata:
  name: shared-load-balancer
spec:
  type: LoadBalancer
  selector:
    lb: shared-load-balancer
  ports:
    - name: kafka
      port: 8080
      targetPort: 8080
    - name: flink-webui
      port: 8081
      targetPort: 8081
    - name: redis
      port: 5540
      targetPort: 5540
    - name: prometheus
      port: 9090
      targetPort: 9090
    - name: grafana
      port: 3000
      targetPort: 3000
