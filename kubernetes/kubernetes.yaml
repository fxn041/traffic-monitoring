# kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-master
  template:
    metadata:
      labels:
        app: kafka-master
    spec:
      containers:
        - name: kafka-master
          image: bigdataa9/kafka:latest
          ports:
            - containerPort: 19092
              name: internal
            - containerPort: 19093
              name: controller
            - containerPort: 9999
              name: jmx
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:19093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka-master:19092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: CLUSTER_ID
              value: "rsfYZfkmTuKhPF7qhB17fg"
            - name: KAFKA_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_JMX_PORT
              value: "9999"
            - name: KAFKA_JMX_OPTS
              value: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-master -Dcom.sun.management.jmxremote.rmi.port=9999"
            - name: KAFKA_JMX_HOSTNAME
              value: "kafka-master"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-master
spec:
  selector:
    app: kafka-master
  ports:
    - port: 19092
      name: internal
      targetPort: 19092
    - port: 19093
      name: controller
      targetPort: 19093
    - port: 9999
      name: jmx
      targetPort: 9999
---
# kafka-producer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer
  template:
    metadata:
      labels:
        app: kafka-producer
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka-master 19092; do echo waiting for kafka; sleep 5; done; echo kafka is up']
        - name: wait-for-schema-registry
          image: busybox
          command: ['sh', '-c', 'until nc -z schema-registry-master 8082; do echo waiting for schema-registry; sleep 5; done; echo schema-registry is up']
      containers:
        - name: kafka-producer
          image: bigdataa9/kafka-producer:latest
---
# schema-registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry-master
  template:
    metadata:
      labels:
        app: schema-registry-master
    spec:
      containers:
        - name: schema-registry-master
          image: confluentinc/cp-schema-registry:7.9.1
          ports:
            - containerPort: 8082
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry-master"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "kafka-master:19092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8082"
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-master
spec:
  selector:
    app: schema-registry-master
  ports:
    - port: 8082
      targetPort: 8082
---
# postgresql
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:14
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "conduktor-console"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: project-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
# conduktor-console
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conduktor-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conduktor-console
      lb: shared-load-balancer
  template:
    metadata:
      labels:
        app: conduktor-console
        lb: shared-load-balancer
    spec:
      containers:
        - name: conduktor-console
          image: conduktor/conduktor-console:1.30.0
          ports:
            - containerPort: 8080
          env:
            - name: CDK_DATABASE_HOST
              value: "postgresql"
            - name: CDK_DATABASE_PORT
              value: "5432"
            - name: CDK_DATABASE_NAME
              value: "conduktor-console"
            - name: CDK_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: project-secret
                  key: POSTGRES_USER
            - name: CDK_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-secret
                  key: POSTGRES_PASSWORD
            - name: CDK_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: project-secret
                  key: CONDUKTOR_ADMIN_EMAIL
            - name: CDK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-secret
                  key: CONDUKTOR_ADMIN_PASSWORD
            - name: CDK_CLUSTERS_0_ID
              value: "kafka-cluster"
            - name: CDK_CLUSTERS_0_NAME
              value: "Kafka Cluster"
            - name: CDK_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-master:19092"
            - name: CDK_CLUSTERS_0_JMXPORT
              value: "9999"
            - name: CDK_CLUSTERS_0_SCHEMAREGISTRY_URL
              value: "http://schema-registry-master:8082"
            - name: CDK_MONITORING_CORTEX-URL
              value: "http://conduktor-monitoring:9009/"
            - name: CDK_MONITORING_ALERT-MANAGER-URL
              value: "http://conduktor-monitoring:9010/"
            - name: CDK_MONITORING_CALLBACK-URL
              value: "http://conduktor-console:8080/monitoring/api/"
            - name: CDK_MONITORING_NOTIFICATIONS-CALLBACK-URL
              value: "http://localhost:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: conduktor-console
spec:
  selector:
    app: conduktor-console
  ports:
    - port: 8080
      targetPort: 8080
---
# conduktor-monitoring
apiVersion: apps/v1
